[project]
name = "dnd-rag"
version = "0.4.0"
description = "Multiplayer D&D assistant with authoritative game state and evaluated RAG"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0",
    "fastembed>=0.7.3",
    "gitpython>=3.1.55",
    "llama-index>=0.14.23",
    "llama-index-embeddings-ollama>=0.9.0",
    "llama-index-llms-ollama>=0.10.1",
    "llama-index-llms-openai-like>=0.7.2",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.1",
    "pymupdf>=1.28.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "redis>=5.2.0",
    "setuptools>=83.0.0",
    "streamlit>=1.58.0",
    "uvicorn[standard]>=0.35.0",
]
