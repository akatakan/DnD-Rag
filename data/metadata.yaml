PlayerDnDBasicRules:
  title: "D&D Basic Rules: Player's Version"
  description: >
    D&D oyuncu kuralları kitabı. Karakter oluşturma, ırklar, sınıflar,
    yetenekler, büyüler, ekipman ve savaş mekaniği hakkındaki sorular için kullan.

DMBasicRules:
  title: "D&D Basic Rules: Dungeon Master's Version"
  description: >
    D&D Dungeon Master kuralları kitabı. Oyun yönetimi, encounter tasarımı,
    canavar istatistikleri, tuzaklar, ödüller ve macera akışı için kullan.
