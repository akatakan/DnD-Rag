name: release-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sync locked Python environment
        run: uv sync --locked
      - name: Python tests
        run: uv run pytest -q
      - name: Expiring security exception policy
        run: uv run python -m api.release_gate --check-policy-only
      - name: Python dependency audit
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uv tool run pip-audit==2.10.1 -r "$RUNNER_TEMP/audit-requirements.txt" --ignore-vuln PYSEC-2026-597
      - name: Frontend install
        working-directory: web
        run: npm ci
      - name: Frontend dependency audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend production build
        working-directory: web
        run: npm run build
      - name: Upload and parser security tests
        run: >-
          uv run pytest -q tests/test_map_assets.py
          tests/test_release_tools.py tests/test_public_auth.py
      - name: Diff hygiene
        run: git diff --check
