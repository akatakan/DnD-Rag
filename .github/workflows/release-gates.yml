name: release-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sync locked Python environment
        run: uv sync --locked
      - name: Python lint
        run: uv run ruff check .
      - name: Python tests
        run: uv run python -m pytest -q
      - name: Expiring security exception policy
        run: uv run python -m api.release_gate --check-policy-only
      - name: Python dependency audit
        run: |
          uv export --quiet --frozen --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/audit-requirements.txt"
          # Ignore flags come from api/release_gate.py so a flag can never
          # outlive the expiry date the policy step above enforces.
          IGNORES="$(uv run python -m api.release_gate --print-audit-ignores)"
          uv tool run pip-audit==2.10.1 -r "$RUNNER_TEMP/audit-requirements.txt" $IGNORES
      - name: Frontend install
        working-directory: web
        run: npm ci
      - name: Frontend dependency audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend production build
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        # The API serves the build at "/", and playwright.config.ts starts it.
        run: npm run test:e2e
      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
      - name: Upload and parser security tests
        run: >-
          uv run python -m pytest -q tests/test_map_assets.py
          tests/test_release_tools.py tests/test_public_auth.py
      - name: Diff hygiene
        run: git diff --check
